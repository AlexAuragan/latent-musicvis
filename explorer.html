<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latent Space Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #08080c;
      color: #e8e8ec;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 12px 20px;
      border-bottom: 1px solid #1a1a24;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #0c0c12;
      flex-wrap: wrap;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 500;
      color: #a0a0b0;
    }
    .upload-btn {
      padding: 8px 16px;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .upload-btn:hover { background: #1d4ed8; }
    .upload-btn:disabled { opacity: 0.6; cursor: wait; }
    .status {
      color: #606070;
      font-size: 13px;
      flex: 1;
    }
    .server-status {
      font-size: 11px;
      padding: 4px 8px;
      background: #18182b;
      border-radius: 4px;
      color: #6366f1;
    }
    .server-status.offline {
      background: #3b1818;
      color: #ef4444;
    }
    #canvas-container {
      flex: 1;
      position: relative;
    }
    .info-panel {
      position: absolute;
      bottom: 60px;
      left: 20px;
      background: rgba(12, 12, 18, 0.9);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #1a1a24;
      font-size: 13px;
      display: none;
    }
    .info-panel.visible { display: block; }
    .info-panel .idx { color: #6366f1; margin-bottom: 4px; }
    .info-panel .time { color: #606070; }
    .info-panel .playing { color: #22c55e; margin-top: 4px; }
    .footer {
      padding: 10px 20px;
      border-top: 1px solid #1a1a24;
      font-size: 12px;
      color: #404050;
      background: #0c0c12;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .footer-text {
      flex-shrink: 0;
      flex: 1;
    }
    .playbar-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      opacity: 0.3;
      pointer-events: none;
    }
    .playbar-container.enabled {
      opacity: 1;
      pointer-events: auto;
    }
    .playbar-time {
      font-size: 12px;
      color: #a0a0b0;
      font-variant-numeric: tabular-nums;
      min-width: 45px;
    }
    .playbar-time.end { text-align: right; }
    .volume-control {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
    }
    .volume-icon {
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .volume-slider {
      width: 70px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 2px;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }
    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .playbar {
      flex: 1;
      height: 6px;
      background: #1a1a24;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .playbar-progress {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #06b6d4, #8b5cf6);
      border-radius: 3px;
      width: 0%;
      pointer-events: none;
    }
    .playbar-handle {
      position: absolute;
      left: 0%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    input[type="file"] { display: none; }
    .cluster-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cluster-control input[type="range"] {
      -webkit-appearance: none;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }
    .cluster-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: #6366f1;
      border-radius: 50%;
      cursor: pointer;
    }

    /* Palette editon */
    .footer-btn {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid #27272f;
      background: #111119;
      color: #e5e5f0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .footer-btn:hover {
      background: #181826;
    }

    .palette-editor {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
      margin-right: 12px;
      flex-shrink: 0;
      font-size: 11px;
      color: #888;
    }

    .palette-label {
      color: #a0a0b0;
    }

    .palette-label.small {
      font-size: 10px;
      opacity: 0.8;
    }

    .palette-editor input[type="color"] {
      width: 18px;
      height: 18px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }

    .palette-apply-btn {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid #27272f;
      background: #111119;
      color: #e5e5f0;
      cursor: pointer;
    }

    .palette-apply-btn:hover {
      background: #181826;
    }
    .palette-editor input[type="range"] {
      -webkit-appearance: none;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }

    .palette-editor input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: #6366f1;
      border-radius: 50%;
      cursor: pointer;
    }

    .palette-editor input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      background: #6366f1;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }



  </style>
</head>
<body>
  <div id="app">
    <div class="header">
        <label class="upload-btn" id="upload-btn">
          <span id="upload-label-text">Upload Audio</span>
          <input type="file" id="file-input" accept="audio/*">
        </label>

        <button class="upload-btn" id="youtube-toggle-btn" style="background:#ec4899;">
          YouTube URL
        </button>

        <div id="youtube-form" style="display:none;align-items:center;gap:6px;">
          <input
            type="text"
            id="youtube-url-input"
            placeholder="https://youtu.be/..."
            style="font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid #27272f;background:#050509;color:#e5e5f0;min-width:220px;"
          >
          <button class="upload-btn" id="youtube-submit-btn" style="background:#ec4899;">
            Fetch
          </button>
        </div>

        <button class="upload-btn" id="play-btn" style="background:#22c55e;display:none">▶ Play</button>

      <button class="upload-btn" id="line-toggle" style="background:#6366f1;display:none">🌈 Line</button>
      <label class="upload-btn" id="resynth-btn" style="background:#f59e0b;display:none">
        🔀 Resynth
        <input type="file" id="resynth-input" accept="audio/*">
      </label>
      <div class="cluster-control" id="cluster-control" style="display:none">
        <label style="font-size:11px;color:#888">K:</label>
        <input type="range" id="k-slider" min="3" max="20" value="8" style="width:60px">
        <span id="k-value" style="font-size:11px;color:#888;min-width:20px">8</span>
      </div>
      <span class="status" id="status">Upload audio to begin</span>
      <span class="server-status" id="server-status">checking...</span>
    </div>
    <div id="canvas-container"></div>
    <div class="info-panel" id="info-panel">
      <div class="idx" id="info-idx">Latent #0</div>
      <div class="time" id="info-time">Time: 0.000s</div>
      <div class="playing" id="info-playing" style="display:none">▶ Playing</div>
    </div>
    <div class="footer" id="footer">
      <button class="footer-btn" id="styling-btn">🎨 Styling</button>

        <div class="palette-editor" id="palette-editor" style="display:none">
          <span class="palette-label">Theme:</span>
          <input type="color" id="bg-color-input" title="Background" value="#08080c">
          <span class="palette-label small">Points:</span>
          <input type="color" id="pt-color-1" value="#6366f1" title="Point color 1">
          <input type="color" id="pt-color-2" value="#ec4899" title="Point color 2">
          <input type="color" id="pt-color-3" value="#f97316" title="Point color 3">
          <button class="palette-apply-btn" id="palette-apply-btn">Apply</button>

          <!-- NEW: idle alpha + decay controls -->
          <span class="palette-label small" style="margin-left:10px;">Idle α</span>
          <input type="range" id="idle-alpha-slider" min="0" max="100" value="30">
          <span class="palette-label small" id="idle-alpha-value">0.30</span>

          <span class="palette-label small" style="margin-left:10px;">Tail Length</span>
          <input type="range" id="decay-slider" min="3" max="40" value="8">
          <span class="palette-label small" id="decay-value">8</span>
        </div>


      <span class="footer-text" id="footer-text">
        Drag to rotate • Scroll to zoom • Click point to play
      </span>

      <div class="playbar-container" id="playbar-container">
        <span class="playbar-time" id="playbar-current">0:00</span>
        <div class="playbar" id="playbar">
          <div class="playbar-progress" id="playbar-progress"></div>
          <div class="playbar-handle" id="playbar-handle"></div>
        </div>
        <span class="playbar-time end" id="playbar-duration">0:00</span>
        <div class="volume-control">
          <span class="volume-icon" id="volume-icon">🔊</span>
          <input type="range" id="volume-slider" min="0" max="100" value="100" class="volume-slider">
        </div>
      </div>
    </div>

  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="explorer.js"></script>


</body>
</html>
