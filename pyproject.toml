[project]
name = "latent-musicvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.100.0",
    "numpy>=1.24.0",
    "pip>=25.3",
    "python-multipart>=0.0.6",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "pytorch-triton-rocm",
    "umap-learn>=0.5.0",
    "uvicorn>=0.22.0",
    "torchcodec"
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
